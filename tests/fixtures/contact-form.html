<!-- 
  Title: Contact Us Form Fixture
  Purpose: Real-world contact form (Name + Email + Message + Submit) that MUST be detected as a valid submission form.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us - Support</title>
  </head>
  <body>
    <main class="content-container">
      <h1>Get in touch</h1>
      <p>Please fill out the form below to contact our customer support team.</p>

      <form id="contact-form" action="/contact-us" method="post" class="contact-form">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            required
            placeholder="John Doe"
            value="Jane Smith"
          />
        </div>

        <div class="form-group">
          <label for="email-address">Email Address</label>
          <input
            type="email"
            id="email-address"
            name="email"
            required
            placeholder="john@example.com"
            value="jane.smith@example.com"
          />
        </div>

        <div class="form-group">
          <label for="subject-line">Subject</label>
          <input
            type="text"
            id="subject-line"
            name="subject"
            placeholder="How can we help?"
            value="Question regarding subscription"
          />
        </div>

        <div class="form-group">
          <label for="message-content">Message</label>
          <textarea
            id="message-content"
            name="message"
            rows="5"
            required
            placeholder="Enter your message here..."
          >
Hello, I would like to inquire about annual team billing options.</textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-button">Send message</button>
        </div>
      </form>
    </main>
  </body>
</html>
