<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SubmitLog Icon Verification Sheet</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 40px;
        background: #21262d;
        color: #f0f6fc;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 24px;
      }
      .grid {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .surface {
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #30363d;
        min-width: 280px;
      }
      .surface-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
        opacity: 0.8;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }
      .label {
        font-size: 11px;
        opacity: 0.7;
        width: 40px;
      }
    </style>
  </head>
  <body>
    <h1>SubmitLog Official Icon Verification Sheet (Archive + Check)</h1>
    <div class="grid">
      <!-- White / Light Toolbar Surface -->
      <div class="surface" style="background: #ffffff; color: #1d1d1f">
        <div class="surface-title">Light Toolbar / Page (#ffffff)</div>
        <div class="row">
          <span class="label">128px</span
          ><img src="../../public/icons/icon-128.png" width="128" height="128" />
        </div>
        <div class="row">
          <span class="label">48px</span
          ><img src="../../public/icons/icon-48.png" width="48" height="48" />
        </div>
        <div class="row">
          <span class="label">32px</span
          ><img src="../../public/icons/icon-32.png" width="32" height="32" />
        </div>
        <div class="row">
          <span class="label">16px</span
          ><img src="../../public/icons/icon-16.png" width="16" height="16" />
        </div>
      </div>

      <!-- Deep Charcoal #0d1117 -->
      <div class="surface" style="background: #0d1117; color: #f0f6fc">
        <div class="surface-title">Deep Charcoal Background (#0d1117)</div>
        <div class="row">
          <span class="label">128px</span
          ><img src="../../public/icons/icon-128.png" width="128" height="128" />
        </div>
        <div class="row">
          <span class="label">48px</span
          ><img src="../../public/icons/icon-48.png" width="48" height="48" />
        </div>
        <div class="row">
          <span class="label">32px</span
          ><img src="../../public/icons/icon-32.png" width="32" height="32" />
        </div>
        <div class="row">
          <span class="label">16px</span
          ><img src="../../public/icons/icon-16.png" width="16" height="16" />
        </div>
      </div>

      <!-- Elevated Card #161b22 -->
      <div class="surface" style="background: #161b22; color: #f0f6fc">
        <div class="surface-title">Elevated Dark Surface (#161b22)</div>
        <div class="row">
          <span class="label">128px</span
          ><img src="../../public/icons/icon-128.png" width="128" height="128" />
        </div>
        <div class="row">
          <span class="label">48px</span
          ><img src="../../public/icons/icon-48.png" width="48" height="48" />
        </div>
        <div class="row">
          <span class="label">32px</span
          ><img src="../../public/icons/icon-32.png" width="32" height="32" />
        </div>
        <div class="row">
          <span class="label">16px</span
          ><img src="../../public/icons/icon-16.png" width="16" height="16" />
        </div>
      </div>
    </div>
  </body>
</html>
