<!-- 
  Title: Traditional Form Fixture
  Purpose: Test extraction of standard HTML form inputs with clear labels.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Traditional Form</title>
  </head>
  <body>
    <form id="traditional-form">
      <div>
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" value="John Doe" />
      </div>

      <div>
        <label for="emailAddress">Email:</label>
        <input type="email" id="emailAddress" name="emailAddress" value="john.doe@example.com" />
      </div>

      <div>
        <label for="phoneNumber">Phone:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" value="+1-555-0198" />
      </div>

      <div>
        <label for="address">Address:</label>
        <textarea id="address" name="address">123 Main St, Springfield, IL</textarea>
      </div>

      <div>
        <label for="country">Country:</label>
        <select id="country" name="country">
          <option value="us" selected>United States</option>
          <option value="ca">Canada</option>
          <option value="uk">United Kingdom</option>
        </select>
      </div>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
