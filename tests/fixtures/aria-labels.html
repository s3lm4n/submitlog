<!-- 
  Title: ARIA Labels Form Fixture
  Purpose: Test extraction of form inputs that rely on ARIA attributes for accessibility and labeling.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ARIA Labels Form</title>
  </head>
  <body>
    <form id="aria-form">
      <div>
        <!-- Input with aria-label -->
        <input type="text" aria-label="First Name" name="fname" value="Jane" />
      </div>

      <div>
        <!-- Input with aria-labelledby -->
        <h3 id="section-title">Department Name</h3>
        <input type="text" aria-labelledby="section-title" name="department" value="Engineering" />
      </div>

      <div>
        <!-- Textarea with aria-describedby -->
        <span id="desc">Please describe your issue in detail below.</span>
        <textarea aria-describedby="desc" name="issueDetails">
The application is running slowly on startup.</textarea>
      </div>

      <button type="button">Save</button>
    </form>
  </body>
</html>
